<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greek Audio Player 2</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    :root {
      --bg: #f5f5f5;
      --panel: #ffffff;
      --line: #dcdcdc;
      --text: #1f1f1f;
      --muted: #6f6f6f;
      --primary: #1d6f5f;
      --primary-soft: #eef7f4;
      --radius: 14px;
      --sans: "Segoe UI", "Trebuchet MS", sans-serif;
      --serif: "Georgia", "Times New Roman", serif;
      --mono: "Consolas", "SFMono-Regular", monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: min(760px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }

    .pair-index {
      font: 600 12px/1 var(--mono);
      color: var(--muted);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button,
    input {
      font: inherit;
    }

    .button {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 12px;
      cursor: pointer;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease, color 160ms ease;
    }

    .button:hover,
    .field input:hover,
    .field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-soft);
      outline: none;
    }

    .button.active,
    .button.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .icon-button {
      width: 52px;
      height: 52px;
      display: inline-grid;
      place-items: center;
      font-size: 18px;
    }

    .toggle-button {
      min-width: 52px;
      height: 52px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      white-space: nowrap;
    }

    .stage {
      padding: 20px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 20px 22px;
      min-height: 150px;
    }

    .card + .card {
      margin-top: 12px;
    }

    .card.active {
      border-color: var(--primary);
    }

    .card.waiting {
      border-style: dashed;
    }

    .label {
      margin-bottom: 14px;
      color: var(--muted);
      font: 600 12px/1 var(--mono);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .phrase {
      margin: 0;
      font-size: clamp(30px, 4.8vw, 44px);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .phrase.el {
      font-family: var(--serif);
    }

    .phrase.hidden {
      color: transparent;
      user-select: none;
    }

    .settings {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 12px;
      padding: 0 20px 20px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      color: var(--muted);
      font: 600 11px/1.2 var(--mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      background: #fff;
      color: var(--text);
    }

    @media (max-width: 760px) {
      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .controls {
        justify-content: space-between;
      }

      .settings {
        grid-template-columns: 1fr;
      }

      .toggle-button {
        flex: 1 1 auto;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div id="pairIndex" class="pair-index">001 / 168</div>
      <div class="controls">
        <button id="shuffleButton" class="button toggle-button active" type="button" aria-label="Shuffle">
          <i class="fa-solid fa-shuffle"></i>
        </button>
        <button id="prevButton" class="button icon-button" type="button" aria-label="Previous pair">
          <i class="fa-solid fa-backward-step"></i>
        </button>
        <button id="playButton" class="button icon-button primary" type="button" aria-label="Play or pause">
          <i id="playIcon" class="fa-solid fa-play"></i>
        </button>
        <button id="nextButton" class="button icon-button" type="button" aria-label="Next pair">
          <i class="fa-solid fa-forward-step"></i>
        </button>
      </div>
    </header>

    <section class="stage">
      <article id="ruCard" class="card active">
        <div class="label">Русский</div>
        <p id="ruText" class="phrase">Загрузка...</p>
      </article>
      <article id="elCard" class="card waiting">
        <div class="label">Ελληνικά</div>
        <p id="elText" class="phrase el hidden">...</p>
      </article>
    </section>

    <section class="settings">
      <button id="pauseAfterRussianButton" class="button toggle-button" type="button" aria-pressed="false">После русского: 700 мс</button>
      <div class="field">
        <label for="delayAfterRussian">Время после русского, мс</label>
        <input id="delayAfterRussian" type="number" min="0" step="100" value="700">
      </div>
      <div class="field">
        <label for="delayAfterGreek">Время после греческого, мс</label>
        <input id="delayAfterGreek" type="number" min="0" step="100" value="1000">
      </div>
    </section>
  </main>

  <audio id="player" preload="auto"></audio>

  <script src="transcript.js"></script>
  <script>
    const transcriptText = typeof window.transcriptText === "string" ? window.transcriptText : "";
    const lines = transcriptText
      .split("\n")
      .map((line) => String(line).trim())
      .filter(Boolean);

    const pairs = lines.map((line, index) => {
      const [ru, el] = line.split("=").map((part) => part.trim());
      return {
        index,
        ru,
        el,
        russianAudio: `Audio/${String(index * 2).padStart(4, "0")}.mp3`,
        greekAudio: `Audio/${String(index * 2 + 1).padStart(4, "0")}.mp3`,
      };
    });

    const storageKey = "greek-audio-player-settings-v4";
    const player = document.getElementById("player");
    const ruText = document.getElementById("ruText");
    const elText = document.getElementById("elText");
    const pairIndex = document.getElementById("pairIndex");
    const ruCard = document.getElementById("ruCard");
    const elCard = document.getElementById("elCard");
    const shuffleButton = document.getElementById("shuffleButton");
    const prevButton = document.getElementById("prevButton");
    const playButton = document.getElementById("playButton");
    const playIcon = document.getElementById("playIcon");
    const nextButton = document.getElementById("nextButton");
    const pauseAfterRussianButton = document.getElementById("pauseAfterRussianButton");
    const delayAfterRussianInput = document.getElementById("delayAfterRussian");
    const delayAfterGreekInput = document.getElementById("delayAfterGreek");

    const settings = loadSettings();

    let currentIndex = 0;
    let currentPhase = "idle";
    let pendingTimerId = 0;
    let isRunning = false;
    let history = [];
    let pausedMode = null;

    if (pairs.length === 0) {
      ruText.textContent = "Нет данных";
      elText.textContent = "";
      [shuffleButton, prevButton, playButton, nextButton, pauseAfterRussianButton, delayAfterRussianInput, delayAfterGreekInput]
        .forEach((element) => element.disabled = true);
    } else {
      syncControls();
      setPair(0);
    }

    playButton.addEventListener("click", async () => {
      if (pairs.length === 0) {
        return;
      }

      if (currentPhase === "waiting-greek") {
        isRunning = true;
        pausedMode = null;
        await playGreek();
        return;
      }

      if (isPausePhase(currentPhase)) {
        pauseFlow();
        return;
      }

      if (currentPhase === "paused") {
        await resumeFlow();
        return;
      }

      isRunning = true;
      pausedMode = null;
      await playRussian();
    });

    nextButton.addEventListener("click", async () => {
      if (pairs.length === 0) {
        return;
      }
      await goToNextPair(true);
    });

    prevButton.addEventListener("click", async () => {
      if (pairs.length === 0) {
        return;
      }
      await goToPreviousPair();
    });

    shuffleButton.addEventListener("click", () => {
      settings.shuffle = !settings.shuffle;
      persistSettings();
      syncControls();
    });

    pauseAfterRussianButton.addEventListener("click", () => {
      settings.pauseAfterRussian = !settings.pauseAfterRussian;
      persistSettings();
      syncControls();
    });

    delayAfterRussianInput.addEventListener("change", () => {
      settings.delayAfterRussian = clampDelay(Number(delayAfterRussianInput.value), 700);
      persistSettings();
      syncControls();
    });

    delayAfterGreekInput.addEventListener("change", () => {
      settings.delayAfterGreek = clampDelay(Number(delayAfterGreekInput.value), 1000);
      persistSettings();
      syncControls();
    });

    player.addEventListener("ended", async () => {
      if (currentPhase === "playing-ru") {
        if (settings.pauseAfterRussian) {
          currentPhase = "waiting-greek";
          pausedMode = "greek";
          isRunning = false;
          setCardState("waiting-greek");
          updatePlayIcon();
          return;
        }

        scheduleGreek(settings.delayAfterRussian);
        return;
      }

      if (currentPhase === "playing-el") {
        currentPhase = "after-greek";
        pausedMode = "next-pair";
        setCardState("idle");
        updatePlayIcon();
        scheduleNextPair(settings.delayAfterGreek);
      }
    });

    function loadSettings() {
      try {
        const raw = localStorage.getItem(storageKey);
        if (!raw) {
          return defaultSettings();
        }

        const parsed = JSON.parse(raw);
        return {
          shuffle: parsed.shuffle !== false,
          pauseAfterRussian: Boolean(parsed.pauseAfterRussian),
          delayAfterRussian: clampDelay(Number(parsed.delayAfterRussian), 700),
          delayAfterGreek: clampDelay(Number(parsed.delayAfterGreek), 1000),
        };
      } catch {
        return defaultSettings();
      }
    }

    function defaultSettings() {
      return {
        shuffle: true,
        pauseAfterRussian: false,
        delayAfterRussian: 700,
        delayAfterGreek: 1000,
      };
    }

    function persistSettings() {
      localStorage.setItem(storageKey, JSON.stringify(settings));
    }

    function clampDelay(value, fallback) {
      if (!Number.isFinite(value)) {
        return fallback;
      }
      return Math.max(0, Math.min(10000, Math.round(value)));
    }

    function syncControls() {
      shuffleButton.classList.toggle("active", settings.shuffle);
      pauseAfterRussianButton.classList.toggle("active", settings.pauseAfterRussian);
      pauseAfterRussianButton.setAttribute("aria-pressed", String(settings.pauseAfterRussian));
      pauseAfterRussianButton.textContent = settings.pauseAfterRussian
        ? "После русского: пауза"
        : `После русского: ${settings.delayAfterRussian} мс`;
      delayAfterRussianInput.value = String(settings.delayAfterRussian);
      delayAfterGreekInput.value = String(settings.delayAfterGreek);
      updatePlayIcon();
    }

    function updatePlayIcon() {
      playIcon.className = isPausePhase(currentPhase) ? "fa-solid fa-pause" : "fa-solid fa-play";
    }

    function isPausePhase(phase) {
      return phase === "playing-ru"
        || phase === "playing-el"
        || phase === "scheduled-greek"
        || phase === "after-greek";
    }

    function clearScheduledAction() {
      if (pendingTimerId) {
        window.clearTimeout(pendingTimerId);
        pendingTimerId = 0;
      }
    }

    function setPair(index, updateIcon = true) {
      currentIndex = ((index % pairs.length) + pairs.length) % pairs.length;
      const pair = pairs[currentIndex];
      ruText.textContent = pair.ru;
      elText.textContent = pair.el;
      hideGreekText();
      pairIndex.textContent = `${String(currentIndex + 1).padStart(3, "0")} / ${String(pairs.length).padStart(3, "0")}`;
      setCardState("idle");
      if (updateIcon) {
        updatePlayIcon();
      }
    }

    function hideGreekText() {
      elText.classList.add("hidden");
    }

    function showGreekText() {
      elText.classList.remove("hidden");
    }

    function setCardState(state) {
      ruCard.classList.remove("active", "waiting");
      elCard.classList.remove("active", "waiting");

      if (state === "playing-ru") {
        ruCard.classList.add("active");
        elCard.classList.add("waiting");
        return;
      }

      if (state === "waiting-greek") {
        ruCard.classList.add("waiting");
        elCard.classList.add("active");
        return;
      }

      if (state === "playing-el") {
        ruCard.classList.add("waiting");
        elCard.classList.add("active");
        return;
      }

      ruCard.classList.add("active");
      elCard.classList.add("waiting");
    }

    async function playRussian() {
      clearScheduledAction();
      hideGreekText();
      currentPhase = "playing-ru";
      pausedMode = "audio";
      isRunning = true;
      setCardState("playing-ru");
      await startAudio(pairs[currentIndex].russianAudio, false);
    }

    async function playGreek() {
      clearScheduledAction();
      currentPhase = "playing-el";
      pausedMode = "audio";
      isRunning = true;
      setCardState("playing-el");
      const started = await startAudio(pairs[currentIndex].greekAudio, true);
      if (started) {
        showGreekText();
      }
    }

    async function startAudio(source, revealGreekOnStart) {
      player.src = source;
      player.currentTime = 0;
      updatePlayIcon();
      try {
        await player.play();
        if (revealGreekOnStart) {
          showGreekText();
        }
        return true;
      } catch (error) {
        currentPhase = "idle";
        isRunning = false;
        pausedMode = null;
        updatePlayIcon();
        console.error(error);
        return false;
      }
    }

    function pauseFlow() {
      clearScheduledAction();

      if (currentPhase === "scheduled-greek") {
        currentPhase = "paused";
        pausedMode = "greek";
        isRunning = false;
        updatePlayIcon();
        return;
      }

      if (currentPhase === "after-greek") {
        currentPhase = "paused";
        pausedMode = "next-pair";
        isRunning = false;
        updatePlayIcon();
        return;
      }

      player.pause();
      currentPhase = "paused";
      pausedMode = "audio";
      isRunning = false;
      updatePlayIcon();
    }

    async function resumeFlow() {
      isRunning = true;

      if (pausedMode === "greek") {
        await playGreek();
        return;
      }

      if (pausedMode === "next-pair") {
        await goToNextPair(false);
        return;
      }

      try {
        await player.play();
        currentPhase = player.src.endsWith(pairs[currentIndex].russianAudio)
          ? "playing-ru"
          : "playing-el";
        if (currentPhase === "playing-el") {
          showGreekText();
        }
        setCardState(currentPhase);
        updatePlayIcon();
      } catch (error) {
        currentPhase = "idle";
        isRunning = false;
        updatePlayIcon();
        console.error(error);
      }
    }

    function scheduleGreek(delay) {
      currentPhase = "scheduled-greek";
      pausedMode = "greek";
      updatePlayIcon();
      pendingTimerId = window.setTimeout(() => {
        void playGreek();
      }, delay);
    }

    function scheduleNextPair(delay) {
      currentPhase = "after-greek";
      pausedMode = "next-pair";
      updatePlayIcon();
      pendingTimerId = window.setTimeout(() => {
        void goToNextPair(false);
      }, delay);
    }

    async function goToNextPair(manual) {
      clearScheduledAction();
      player.pause();
      if (!history.length || history[history.length - 1] !== currentIndex) {
        history.push(currentIndex);
      }
      const nextIndex = settings.shuffle ? pickRandomIndex() : currentIndex + 1;
      isRunning = manual ? true : true;
      pausedMode = null;
      setPair(nextIndex, manual);
      await playRussian();
    }

    async function goToPreviousPair() {
      clearScheduledAction();
      player.pause();
      const previousIndex = history.length ? history.pop() : currentIndex - 1;
      setPair(previousIndex);
      if (isRunning || isPausePhase(currentPhase) || currentPhase === "paused") {
        pausedMode = null;
        isRunning = true;
        await playRussian();
      }
    }

    function pickRandomIndex() {
      if (pairs.length <= 1) {
        return 0;
      }
      let next = Math.floor(Math.random() * pairs.length);
      while (next === currentIndex) {
        next = Math.floor(Math.random() * pairs.length);
      }
      return next;
    }
  </script>
</body>
</html>
